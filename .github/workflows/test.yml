name: Test

on:
  # Feature branches are covered by their pull_request run; a push trigger on
  # every branch ran the suite twice per PR push.
  push:
    branches: [main]
  pull_request:
    branches: ['**']

# A new push to a PR supersedes the run for the previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # EXPERIMENT: serial vs xdist timing, reverted before merge.
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, xdist]
    name: test (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: uv sync --group dev

      - run: nproc

      - name: Run tests
        run: |
          if [ "${{ matrix.mode }}" = xdist ]; then
            uv run pytest -n auto --durations=30
          else
            uv run pytest --durations=30
          fi
