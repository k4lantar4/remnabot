name: Test

on:
  # Feature branches are covered by their pull_request run; a push trigger on
  # every branch ran the suite twice per PR push.
  push:
    branches: [main]
  pull_request:
    branches: ['**']

# A new push to a PR supersedes the run for the previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: uv sync --group dev

      # One worker per runner CPU (4): measured 4:20 serial vs 2:00 here.
      - name: Run tests
        run: uv run pytest -n auto
