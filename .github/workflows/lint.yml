name: Lint

on:
  # Feature branches are covered by their pull_request run.
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  # release.yml runs this workflow with `uses:`; without this trigger a v* tag run fails at startup.
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .
