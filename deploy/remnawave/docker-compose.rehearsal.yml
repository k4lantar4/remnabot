# Isolated rehearsal Remnawave track (backend/db/redis/sub).
# Derived from production Bot `/opt/remnawave/docker-compose.yml` structure
# (read-only `ssh bot`, M2-T0). Do not copy sandbox identities
# (backend:3, postgres:18.4, remnawave-db-data). Do not copy production
# bind-mounts (hysteria2 patch, caddy certs, geosite).
#
# M2-T0 production restore-track pins (G2 frozen volume rehearsal_rw_pg17):
#   remnawave/backend:2.8.1
#     sha256:361f9bb0b183d4fcefea2f1f7163db490e2aa1ec3b4bdde016a9ab9229ce956b
#   postgres:17.6
#     sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
#   remnawave/subscription-page:7.2.6
#     sha256:da5ee26ec70ecd81e57303993e8bfb74c8e52f2fa74644b84aad53324cde2e8c
# M3-T1 candidate (Prisma on copy volume rehearsal_rw_pg17_candidate):
#   remnawave/backend:3.4.3
#     sha256:4ea85b2fc16bd3e5d367b61afc07ec219133eaa12dd7b5e898adc33c84515422
# Stay on PG 17.6 (M3-T2). Do not use :3, :latest, or official compose postgres:18.4.
# E8: restored production `nodes` dual-control live agents. Keep `nodes` empty
# (or only an isolated dummy). Panel bind is 127.0.0.1:3100 — not rw.rookari.com.

name: rehearsal

x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: unless-stopped
  networks:
    - rehearsal_net

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: '5'

services:
  rehearsal_rw_db:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    container_name: rehearsal_rw_db
    hostname: rehearsal_rw_db
    <<: [*common, *logging]
    environment:
      POSTGRES_USER: rehearsal_rw
      POSTGRES_PASSWORD: rehearsal_rw_pg_placeholder
      POSTGRES_DB: postgres
      TZ: UTC
    ports:
      - '127.0.0.1:6768:5432'
    volumes:
      # G2 2.8.1 dump remains on unmounted rehearsal_rw_pg17.
      - rehearsal_rw_pg17_candidate:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rehearsal_rw -d postgres']
      interval: 3s
      timeout: 10s
      retries: 3

  rehearsal_rw_redis:
    image: valkey/valkey:9-alpine
    container_name: rehearsal_rw_redis
    hostname: rehearsal_rw_redis
    <<: [*common, *logging]
    volumes:
      - rehearsal_rw_valkey_socket:/var/run/valkey
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
      --unixsocket /var/run/valkey/valkey.sock
      --unixsocketperm 777
      --port 0
    healthcheck:
      test: ['CMD', 'valkey-cli', '-s', '/var/run/valkey/valkey.sock', 'ping']
      interval: 3s
      timeout: 3s
      retries: 3

  rehearsal_rw:
    image: remnawave/backend:3.4.3@sha256:4ea85b2fc16bd3e5d367b61afc07ec219133eaa12dd7b5e898adc33c84515422
    container_name: rehearsal_rw
    hostname: rehearsal_rw
    <<: [*common, *logging]
    # JWT_* leftover from 2.8.1 env; 3.4.3 requires class-C APP_SECRET in
    # gitignored ../../.env.rehearsal-rw (M3-T1). Do not inline secrets.
    env_file:
      - ../../.env.rehearsal-rw
    environment:
      APP_PORT: '3000'
      METRICS_PORT: '3001'
      API_INSTANCES: '1'
      DATABASE_URL: postgresql://rehearsal_rw:rehearsal_rw_pg_placeholder@rehearsal_rw_db:5432/postgres
      REDIS_SOCKET: /var/run/valkey/valkey.sock
      IS_TELEGRAM_NOTIFICATIONS_ENABLED: 'false'
      WEBHOOK_ENABLED: 'false'
      IS_DOCS_ENABLED: 'false'
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - rehearsal_rw_valkey_socket:/var/run/valkey
    ports:
      - '127.0.0.1:3100:3000'
      - '127.0.0.1:3101:3001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    depends_on:
      rehearsal_rw_db:
        condition: service_healthy
      rehearsal_rw_redis:
        condition: service_healthy

  rehearsal_sub:
    image: remnawave/subscription-page:7.2.6@sha256:da5ee26ec70ecd81e57303993e8bfb74c8e52f2fa74644b84aad53324cde2e8c
    container_name: rehearsal_sub
    hostname: rehearsal_sub
    <<: [*common, *logging]
    environment:
      REMNAWAVE_PANEL_URL: http://rehearsal_rw:3000
      APP_PORT: '3000'
      REMNAWAVE_API_TOKEN: rehearsal_placeholder_rw_api_token
    ports:
      # 7.2.6 listens on 3000 (production mapping). Sandbox :latest used 3010 — do not copy.
      - '127.0.0.1:3110:3000'
    depends_on:
      rehearsal_rw:
        condition: service_healthy

volumes:
  rehearsal_rw_pg17:
    name: rehearsal_rw_pg17
    driver: local
  rehearsal_rw_pg17_candidate:
    name: rehearsal_rw_pg17_candidate
    external: true
    driver: local
  rehearsal_rw_valkey_socket:
    name: rehearsal_rw_valkey_socket
    driver: local

networks:
  rehearsal_net:
    name: rehearsal_net
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1350
